<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HUNT QUANTUM ARCHIVE // HARDCORE MAIN TERMINAL</title>
  <style>
    /* Estructura de Terminal Avanzada compatible con Google Sites al 100% */
    body {
      background-color: #000000;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      padding: 10px;
      margin: 0;
      font-size: 12px;
    }
    .terminal-container {
      border: 2px solid #00ff00;
      padding: 15px;
      background-color: #020a02;
      max-width: 800px;
      margin: 10px auto;
      box-shadow: 0 0 25px #00ff00; /* Brillo neón radiactivo global */
    }
    
    .header-table {
      width: 100%;
      border-collapse: collapse;
      border-bottom: 2px solid #00ff00;
      margin-bottom: 15px;
    }
    .header-cell {
      padding-bottom: 8px;
      vertical-align: middle;
    }

    /* CONTROL DE CONTENEDORES PARA LAS BANDERAS NATIVAS */
    .flag-holder-table {
      display: inline-block;
      border-collapse: separate;
      border-spacing: 12px 0;
    }
    .flag-box {
      width: 44px;
      height: 26px;
      border: 1px solid #ffffff;
      box-shadow: 0 0 12px rgba(255,255,255,0.6);
      border-collapse: collapse;
    }

    .ascii-matrix-mesh {
      background-color: #000000;
      border: 1px dashed #00ff00;
      padding: 8px;
      color: #00ff00;
      font-size: 10px;
      line-height: 1.1;
      text-align: center;
      margin: 10px 0;
      letter-spacing: 2px;
      text-shadow: 0 0 5px #00ff00;
    }
    .solution-block {
      background-color: #000000;
      border: 1px solid #00ff00;
      padding: 12px;
      margin-bottom: 15px;
      color: #aaffaa;
    }
    .badge-equation {
      color: #00ff00;
      font-weight: bold;
      background-color: rgba(0,255,0,0.15);
      padding: 4px;
      border-radius: 3px;
      display: inline-block;
      margin: 5px 0;
    }
    .step-line {
      margin-left: 15px;
      margin-bottom: 5px;
      color: #ffffff;
    }
    .footer-stamp {
      border-top: 1px solid #00ff00;
      padding-top: 8px;
      text-align: center;
      font-size: 10px;
      color: #00aa00;
      font-weight: bold;
    }
  </style>
</head>
<body>
